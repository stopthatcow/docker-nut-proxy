version: "3.8"

services:
  nut-proxy:
    build:
      context: .
      args:
        ALPINE_VERSION: ${ALPINE_VERSION:-latest}
        NUT_VERSION: ${NUT_VERSION:-}
    image: nut-proxy:latest
    container_name: nut-proxy
    restart: unless-stopped
    ports:
      - "3493:3493"
    environment:
      - UPSTREAM_HOST
      - UPSTREAM_PORT
      - UPSTREAM_UPS_NAME
      - UPSTREAM_USER
      - UPSTREAM_PASS
      - LOCAL_UPS_NAME
      - CLIENT_USER
      - CLIENT_PASS
    healthcheck:
      test: ["CMD-SHELL", "upsc ${LOCAL_UPS_NAME:-ups}@127.0.0.1:3493 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s