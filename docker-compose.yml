version: "3.8"

services:
  nut-proxy:
    build:
      context: .
      # Optional: Override base image/package versions during build
      args:
        ALPINE_VERSION: latest
        NUT_VERSION: ""
    image: nut-proxy:latest
    container_name: nut-proxy
    restart: unless-stopped
    ports:
      - "3493:3493"
    environment:
      # Upstream NUT Server Details
      - UPSTREAM_HOST
      - UPSTREAM_USER
      - UPSTREAM_PASS

      # Downstream Client Authentication
      - CLIENT_USER
      - CLIENT_PASS

    # Verify upsd daemon is responding to queries
    healthcheck:
      test: ["CMD", "upsc", "myups@127.0.0.1:3493"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s